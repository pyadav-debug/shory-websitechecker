# Add one table per partner URL.
# Keep the list small and maintainable: adding a new partner is just copying one
# of these blocks and changing the values.
#
# Required fields:
# - name: friendly label shown in logs and alerts
# - url: page to monitor
#
# Optional fields:
# - expected_text: text that should appear somewhere on the page
# - cta_text: CTA label that should appear in a link or button
# - allow_status_codes: status codes that count as healthy, default is [200]

[[urls]]
name = "Partner 1"
url = "https://example.com/partner-1"
expected_text = "Partner 1"
cta_text = "Learn more"
allow_status_codes = [200]

