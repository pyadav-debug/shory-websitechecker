name: Website Health Agent

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  check-sites:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run website health checks
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python monitoring/website_health.py monitoring/website_health_config.toml site/status.json

      - name: Publish latest status to branch Pages
        run: |
          cp site/status.json status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "Status is unchanged."
          else
            git commit -m "Update website health status [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
