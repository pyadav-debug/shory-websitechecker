name: Website Health Agent

permissions:
  contents: write

concurrency:
  group: shory-status-checker
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - status.json
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  check-sites:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run website health checks
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python monitoring/website_health.py monitoring/website_health_config.toml status.json

      - name: Publish latest status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "No status changes to publish."
          else
            git commit -m "Update partner status"
            git push
          fi
