<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shory Partners Status Checker</title>
  <style>
    :root {
      --ink: #17243d; --muted: #7b879d; --page: #eef3fb; --panel: #fff;
      --line: #e4eaf3; --header: #f6f8fc; --brand: #16724a;
      --brand-dark: #0e5c3b; --good: #16875d; --good-bg: #dff6ec;
      --bad: #c54b43; --bad-bg: #fde9e7; --shadow: 0 22px 70px rgba(42,58,88,.13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background: radial-gradient(circle at 12% 8%, rgba(203,239,222,.72), transparent 28%),
        linear-gradient(145deg, #f7f5ed 0%, var(--page) 64%);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }
    main { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 64px 0; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
    h1 { margin: 0; font: 700 clamp(30px,5vw,48px)/1.05 Georgia,serif; letter-spacing: -.035em; color: #102820; }
    button {
      flex: 0 0 auto; border: 0; border-radius: 11px; padding: 13px 20px;
      color: #fff; background: var(--brand); box-shadow: 0 9px 22px rgba(22,114,74,.22);
      cursor: pointer; font: 700 13px/1 "Avenir Next","Segoe UI",sans-serif;
    }
    button:hover { background: var(--brand-dark); }
    button:disabled { cursor: wait; opacity: .62; }
    .table-shell { overflow: hidden; border: 1px solid rgba(218,226,239,.9); border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); }
    .meta { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    .count { color: var(--ink); font-weight: 700; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { padding: 14px 22px; color: #8994a7; background: var(--header); text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    th:nth-child(1) { width: 20%; } th:nth-child(2) { width: 58%; } th:nth-child(3) { width: 22%; }
    td { padding: 22px; border-top: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
    tbody tr:first-child td { border-top: 0; }
    tbody tr:hover { background: #fbfcfe; }
    .partner { font-weight: 750; }
    .url { color: #526985; overflow-wrap: anywhere; text-decoration: none; }
    .url:hover { color: var(--brand); text-decoration: underline; }
    .tag { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 8px 11px; font-weight: 750; white-space: nowrap; }
    .tag::before { width: 7px; height: 7px; border-radius: 50%; background: currentColor; content: ""; }
    .live { color: var(--good); background: var(--good-bg); }
    .issue { color: var(--bad); background: var(--bad-bg); }
    .empty { padding: 58px 22px; color: var(--muted); text-align: center; }
    .error { color: var(--bad); }
    @media (max-width: 700px) {
      main { width: min(100% - 22px,1180px); padding: 32px 0; }
      .title-row { align-items: flex-start; }
      h1 { max-width: 230px; }
      button { padding: 12px 15px; }
      .meta { align-items: flex-start; flex-direction: column; }
      th,td { padding: 16px 12px; }
      th:nth-child(1) { width: 25%; } th:nth-child(2) { width: 47%; } th:nth-child(3) { width: 28%; }
      .tag { padding: 7px 9px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="title-row">
      <h1>Shory Partners Status Checker</h1>
      <button id="refresh" type="button">Refresh status</button>
    </div>
    <section class="table-shell">
      <div class="meta">
        <span class="count" id="count">Loading partner status...</span>
        <span id="last-checked">Loading latest check</span>
      </div>
      <table>
        <thead><tr><th>Partner</th><th>Partner page</th><th>Status</th></tr></thead>
        <tbody id="results"><tr><td class="empty" colspan="3">Loading partner status...</td></tr></tbody>
      </table>
    </section>
  </main>
  <script>
    const refreshButton = document.querySelector('#refresh');
    const count = document.querySelector('#count');
    const lastChecked = document.querySelector('#last-checked');
    const results = document.querySelector('#results');
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const isAvailable = (item) => item.status_code >= 200 && item.status_code < 400;

    function render(data) {
      const checks = data.results || [];
      const available = checks.filter(isAvailable).length;
      const pageWord = checks.length === 1 ? 'page' : 'pages';
      count.textContent = `${available} of ${checks.length} partner ${pageWord} available`;
      lastChecked.textContent = `Last checked ${data.checked_at_uae || data.checked_at_utc || 'unknown'}`;
      results.innerHTML = checks.map((item) => {
        const availableNow = isAvailable(item);
        return `<tr>
          <td class="partner">${escapeHtml(item.name)}</td>
          <td><a class="url" href="${escapeHtml(item.final_url || item.url)}" target="_blank" rel="noreferrer">${escapeHtml(item.url)}</a></td>
          <td><span class="tag ${availableNow ? 'live' : 'issue'}">${availableNow ? 'Available' : 'Not available'}</span></td>
        </tr>`;
      }).join('') || '<tr><td class="empty" colspan="3">No partner pages added yet.</td></tr>';
    }

    async function loadStatus() {
      refreshButton.disabled = true;
      refreshButton.textContent = 'Refreshing...';
      try {
        const response = await fetch(`status.json?ts=${Date.now()}`, {cache: 'no-store'});
        if (!response.ok) throw new Error('Latest status is unavailable');
        render(await response.json());
      } catch (error) {
        count.textContent = 'Unable to load partner status';
        lastChecked.textContent = 'Please try again';
        results.innerHTML = '<tr><td class="empty error" colspan="3">We could not load the latest status.</td></tr>';
      } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = 'Refresh status';
      }
    }

    refreshButton.addEventListener('click', loadStatus);
    loadStatus();
  </script>
</body>
</html>
